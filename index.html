<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>scn剧本阅读器</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: "Segoe UI", system-ui, sans-serif;
    background: #f5f6f8; color: #1e1e1e; margin: 0;
    padding: 24px 16px 60px; display: flex; justify-content: center;
  }
  .app {
    width: 100%; max-width: 900px; background: #fff;
    border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,.08);
    padding: 28px 30px;
  }
  h1 { font-size: 22px; margin: 0 0 6px; font-weight: 600; }
  .sub { color: #666; font-size: 14px; margin: 0 0 22px; line-height: 1.6; }
  .toolbar {
    display: flex; flex-wrap: wrap; align-items: center; gap: 12px;
    margin-bottom: 20px; padding: 14px 16px; background: #f8f9fb;
    border: 1px solid #e5e7eb; border-radius: 10px;
  }
  .toolbar label { font-size: 14px; color: #333; }
  select, button {
    font-family: inherit; font-size: 14px; padding: 8px 16px;
    border-radius: 8px; border: 1px solid #d0d5dd; background: #fff;
    color: #1e1e1e; cursor: pointer; transition: all .15s;
  }
  select:focus, button:focus { outline: 2px solid #3b82f6; outline-offset: 1px; }
  button.primary { background: #3b82f6; border-color: #3b82f6; color: #fff; font-weight: 500; }
  button.primary:hover { background: #2563eb; }
  button.secondary:hover { background: #f1f5f9; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  #status { font-size: 14px; color: #475569; margin-bottom: 16px; min-height: 20px; line-height: 1.6; }

  .resume-bar {
    display: none;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    margin-bottom: 16px;
    background: #ecfdf5;
    border: 1px solid #a7f3d0;
    border-radius: 10px;
    font-size: 14px;
    color: #065f46;
    animation: slideDown .3s ease;
  }
  .resume-bar.show { display: flex; }
  .resume-bar .resume-icon { font-size: 18px; flex-shrink: 0; }
  .resume-bar .resume-text { flex: 1; }
  .resume-bar .resume-text strong { font-weight: 600; }
  .resume-bar button {
    font-size: 13px; padding: 6px 14px; border-radius: 8px;
    background: #fff; border: 1px solid #6ee7b7; color: #065f46;
  }
  .resume-bar button:hover { background: #d1fae5; }
  .resume-bar button.resume-primary {
    background: #10b981; border-color: #10b981; color: #fff;
  }
  .resume-bar button.resume-primary:hover { background: #059669; }
  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .bookmarks-panel {
    display: none;
    margin-bottom: 16px;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    background: #fffbeb;
    overflow: hidden;
    animation: slideDown .25s ease;
  }
  .bookmarks-panel.show { display: block; }
  .bookmarks-header {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 16px;
    background: #fef3c7;
    border-bottom: 1px solid #fde68a;
    font-size: 14px; font-weight: 600; color: #78350f;
    flex-wrap: wrap;
  }
  .bookmarks-header .bookmarks-title { flex: 1; min-width: 70px; }
  .bookmarks-header .bookmarks-count {
    font-size: 12px; font-weight: 500; color: #92400e;
    background: #fde68a; padding: 2px 10px; border-radius: 10px;
    white-space: nowrap;
  }
  .bookmarks-header .force-toggle {
    display: flex; align-items: center; gap: 5px;
    font-size: 12px; font-weight: 500; color: #78350f;
    cursor: pointer; user-select: none; white-space: nowrap;
    background: #fff; border: 1px solid #fde68a;
    padding: 4px 10px; border-radius: 6px;
  }
  .bookmarks-header .force-toggle:hover { background: #fef3c7; }
  .bookmarks-header .force-toggle input { margin: 0; cursor: pointer; }
  .bookmarks-header button {
    font-size: 12px; padding: 4px 10px; border-radius: 6px;
    background: #fff; border: 1px solid #fde68a; color: #78350f;
  }
  .bookmarks-header button:hover { background: #fef3c7; }
  .bookmarks-list {
    max-height: 360px;
    overflow-y: auto;
    padding: 8px 12px;
  }
  .bookmark-item {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 10px 12px;
    margin-bottom: 6px;
    background: #fff;
    border: 1px solid #fde68a;
    border-radius: 8px;
    transition: all .15s;
  }
  .bookmark-item:last-child { margin-bottom: 0; }
  .bookmark-item:hover { border-color: #fbbf24; background: #fffbeb; }
  .bookmark-item.other-file {
    opacity: .85;
    border-style: dashed;
    background: #fefce8;
  }
  .bookmark-item .bm-icon { font-size: 16px; flex-shrink: 0; margin-top: 1px; }
  .bookmark-item .bm-content { flex: 1; min-width: 0; }
  .bookmark-item .bm-file {
    font-size: 12px; color: #6b7280; font-weight: 500;
    margin-bottom: 3px; word-break: break-all;
    display: flex; align-items: center; gap: 4px;
  }
  .bookmark-item.other-file .bm-file { color: #b45309; }
  .bookmark-item .bm-source {
    font-size: 11.5px;
    color: #a16207;
    margin-bottom: 3px;
    word-break: break-all;
    line-height: 1.5;
  }
  .bookmark-item .bm-source-toggle {
    font-size: 11px;
    padding: 1px 6px;
    margin-left: 4px;
    border-radius: 4px;
    background: #fef3c7;
    border: 1px solid #fde68a;
    color: #92400e;
    cursor: pointer;
    font-family: inherit;
    vertical-align: middle;
  }
  .bookmark-item .bm-source-toggle:hover { background: #fde68a; }
  .bookmark-item .bm-source-full {
    margin-top: 4px;
    padding: 4px 8px;
    background: #fefce8;
    border: 1px dashed #fde68a;
    border-radius: 6px;
    font-size: 11px;
    color: #78350f;
  }
  .bookmark-item .bm-line {
    font-size: 12px; color: #92400e; font-weight: 600;
    margin-bottom: 2px;
  }
  .bookmark-item .bm-preview {
    font-size: 13px; color: #475569;
    overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap;
    margin-bottom: 2px;
  }
  .bookmark-item .bm-time {
    font-size: 11px; color: #94a3b8;
  }
  .bookmark-item .bm-actions {
    display: flex; gap: 4px; flex-shrink: 0;
  }
  .bookmark-item .bm-actions button {
    font-size: 12px; padding: 4px 8px; border-radius: 6px;
    background: #fff; border: 1px solid #e5e7eb; color: #334155;
  }
  .bookmark-item .bm-actions button:hover:not(:disabled) { background: #f1f5f9; }
  .bookmark-item .bm-actions button:disabled { opacity: .45; cursor: not-allowed; }
  .bookmark-item .bm-actions button.bm-delete:hover { background: #fee2e2; color: #b91c1c; border-color: #fecaca; }
  .bookmarks-empty {
    padding: 20px 16px;
    text-align: center;
    font-size: 13px;
    color: #94a3b8;
    line-height: 1.7;
  }
  .bookmarks-empty .inline-force-btn {
    margin-top: 12px;
    font-size: 13px; padding: 7px 14px; border-radius: 8px;
    background: #fff; border: 1px solid #fbbf24; color: #92400e;
    cursor: pointer; font-family: inherit;
  }
  .bookmarks-empty .inline-force-btn:hover { background: #fef3c7; }

  .results-section {
    border: 1px solid #e5e7eb; border-radius: 10px;
    overflow: hidden; background: #fff;
  }
  .results-header {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 16px; background: #f8fafc;
    cursor: pointer; user-select: none;
    font-size: 14px; font-weight: 600; color: #334155;
    transition: background .15s;
  }
  .results-header:hover { background: #f1f5f9; }
  .results-header .toggle-icon {
    font-size: 12px; color: #64748b;
    transition: transform .2s ease;
    display: inline-block;
    width: 16px; text-align: center;
  }
  .results-section.collapsed .results-header .toggle-icon {
    transform: rotate(-90deg);
  }
  .results-header .results-title { flex: 1; }
  .results-header .results-badge {
    font-size: 12px; font-weight: 500; color: #64748b;
    background: #e2e8f0; padding: 2px 10px; border-radius: 10px;
    font-variant-numeric: tabular-nums;
  }
  .results-body {
    max-height: 2000px;
    overflow: hidden;
    transition: max-height .3s ease, opacity .2s ease, padding .3s ease;
    opacity: 1;
    padding: 12px 16px 16px;
  }
  .results-section.collapsed .results-body {
    max-height: 0;
    opacity: 0;
    padding-top: 0;
    padding-bottom: 0;
  }
  .results-section.collapsed { border-radius: 10px; }

  .result-item {
    border: 1px solid #e5e7eb; border-radius: 10px; padding: 16px 18px;
    margin-bottom: 12px; background: #fafafa; position: relative;
  }
  .result-item:last-child { margin-bottom: 0; }
  .result-item h3 { margin: 0 0 6px; font-size: 15px; font-weight: 600; color: #1e293b; word-break: break-all; padding-right: 36px; }
  .result-item h3.failed { color: #dc2626; }
  .result-item p { margin: 0 0 10px; font-size: 13px; color: #64748b; }
  .result-item .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .result-item button { font-size: 13px; padding: 6px 14px; background: #fff; border: 1px solid #cbd5e1; color: #1e293b; }
  .result-item button:hover { background: #f1f5f9; }
  .result-item button.preview-btn { background: #eff6ff; border-color: #bfdbfe; color: #1d4ed8; }
  .result-item button.preview-btn:hover { background: #dbeafe; }
  .result-item button.delete-btn { background: #fef2f2; border-color: #fecaca; color: #b91c1c; }
  .result-item button.delete-btn:hover { background: #fee2e2; }

  .card-delete {
    position: absolute; top: 10px; right: 12px;
    background: transparent; border: none; font-size: 18px; line-height: 1;
    color: #94a3b8; cursor: pointer; padding: 4px 8px; border-radius: 6px;
    transition: all .15s;
  }
  .card-delete:hover { background: #fee2e2; color: #dc2626; }

  .preview-section {
    margin-bottom: 28px; border: 1px solid #e5e7eb; border-radius: 10px;
    overflow: hidden; background: #fff; position: relative;
  }
  .preview-header {
    display: flex; align-items: center; gap: 10px; padding: 10px 14px;
    background: #f1f5f9; border-bottom: 1px solid #e5e7eb; font-size: 14px; flex-wrap: wrap;
  }
  .preview-header .preview-title {
    font-weight: 600; color: #1e293b; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 140px;
  }
  .preview-header .preview-count { font-size: 12px; color: #64748b; white-space: nowrap; }
  .preview-header button { font-size: 12px; padding: 4px 10px; border-radius: 6px; }

  .preview-body {
    display: block; width: 100%; margin: 0; padding: 18px 20px;
    border: none; outline: none; resize: none;
    font-family: "Cascadia Code", Consolas, "JetBrains Mono", "Courier New", monospace;
    font-size: 13.5px; line-height: 1.7; color: #1e293b; background: #fcfcfd;
    white-space: pre-wrap; word-break: break-word; overflow: hidden; box-sizing: border-box;
  }
  .preview-body:disabled { color: #94a3b8; background: #fcfcfd; }

  .pager {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    padding: 10px 14px; background: #f8fafc; border-top: 1px solid #e5e7eb;
    flex-wrap: wrap;
  }
  .pager button {
    font-size: 16px; padding: 6px 14px; border-radius: 8px; background: #fff;
    border: 1px solid #cbd5e1; color: #1e293b; cursor: pointer; min-width: 44px; transition: all .15s;
    height: 36px;
  }
  .pager button:hover:not(:disabled) { background: #eff6ff; border-color: #bfdbfe; color: #1d4ed8; }
  .pager button:disabled { opacity: .5; cursor: not-allowed; }
  .pager .page-indicator {
    font-size: 14px; color: #334155; text-align: center;
    font-variant-numeric: tabular-nums;
    min-width: 60px;
  }

  .jump-group {
    display: flex; align-items: center; gap: 4px;
    margin-left: 4px;
  }
  .jump-input {
    width: 56px; padding: 6px 8px; font-size: 13px; font-family: inherit;
    border: 1px solid #cbd5e1; border-radius: 6px; text-align: center;
    font-variant-numeric: tabular-nums; color: #1e293b; background: #fff;
    height: 36px;
  }
  .jump-input:focus { outline: 2px solid #3b82f6; outline-offset: 1px; border-color: #3b82f6; }
  .jump-total { font-size: 13px; color: #64748b; white-space: nowrap; }

  .search-group {
    display: flex; align-items: center; gap: 4px;
    margin-left: auto;
  }
  .search-input {
    width: 120px; padding: 6px 10px; font-size: 13px; font-family: inherit;
    border: 1px solid #cbd5e1; border-radius: 6px;
    color: #1e293b; background: #fff;
    height: 36px;
    transition: border-color .15s, width .2s;
  }
  .search-input:focus { outline: 2px solid #3b82f6; outline-offset: 1px; border-color: #3b82f6; }
  .search-btn {
    padding: 6px 12px; font-size: 13px; height: 36px; border-radius: 6px;
    background: #fff; border: 1px solid #cbd5e1; color: #1e293b; cursor: pointer;
  }
  .search-btn:hover { background: #eff6ff; border-color: #bfdbfe; color: #1d4ed8; }
  .search-info {
    font-size: 12px; color: #64748b; white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }

  .bookmark-btn {
    background: #fffbeb !important;
    border-color: #fde68a !important;
    color: #92400e !important;
    font-size: 16px !important;
    padding: 6px 10px !important;
    min-width: 40px !important;
  }
  .bookmark-btn:hover:not(:disabled) {
    background: #fef3c7 !important;
    border-color: #fbbf24 !important;
    color: #78350f !important;
  }
  .bookmark-btn.active {
    background: #fbbf24 !important;
    border-color: #f59e0b !important;
    color: #fff !important;
  }

  .bookmark-list-btn {
    font-size: 13px !important;
    padding: 6px 12px !important;
    height: 36px;
    position: relative;
  }
  .bookmark-list-btn .bm-badge {
    position: absolute;
    top: -4px; right: -4px;
    background: #f59e0b;
    color: #fff;
    font-size: 10px;
    min-width: 16px;
    height: 16px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 4px;
    font-weight: 600;
  }

  .search-highlight {
    background: #fef08a;
    border-radius: 2px;
    box-shadow: 0 0 0 2px #fef08a;
  }
  .search-highlight.current {
    background: #fb923c;
    box-shadow: 0 0 0 2px #fb923c;
    color: #fff;
  }

  .preview-wrap {
    position: relative;
    background: #fcfcfd;
  }
  .preview-highlight-layer {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    padding: 18px 20px;
    font-family: "Cascadia Code", Consolas, "JetBrains Mono", "Courier New", monospace;
    font-size: 13.5px;
    line-height: 1.7;
    color: transparent;
    white-space: pre-wrap;
    word-break: break-word;
    overflow: hidden;
    box-sizing: border-box;
    z-index: 2;
  }
  .preview-body { position: relative; z-index: 1; background: transparent !important; }

  .pager .settings-btn { font-size: 13px; padding: 6px 12px; min-width: auto; color: #334155; }
  .pager .settings-btn:hover:not(:disabled) { background: #eff6ff; border-color: #bfdbfe; color: #1d4ed8; }

  .error { color: #dc2626; }
  .page-zone { display: none; }

  .preview-section:fullscreen, .preview-section:-webkit-full-screen {
    position: relative; border-radius: 0; border: none; margin: 0;
    display: flex; flex-direction: column; background: #fff; width: 100%; height: 100%;
  }
  .preview-section:fullscreen .preview-header, .preview-section:-webkit-full-screen .preview-header {
    position: absolute; top: 0; left: 0; right: 0;
    background: rgba(241,245,249,.92); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    border-bottom: 1px solid rgba(203,213,225,.7); z-index: 8; flex-shrink: 0;
    justify-content: flex-end;
    gap: 16px;
  }
  .preview-section:fullscreen .preview-wrap, .preview-section:-webkit-full-screen .preview-wrap {
    flex: 1; width: 100%; height: auto; min-height: 0;
    background: #fff;
  }
  .preview-section:fullscreen .preview-body, .preview-section:-webkit-full-screen .preview-body {
    width: 100%; height: 100%;
    padding-top: 64px; padding-bottom: 48px; background: transparent !important;
  }
  .preview-section:fullscreen .preview-highlight-layer, .preview-section:-webkit-full-screen .preview-highlight-layer {
    padding-top: 64px; padding-bottom: 48px;
  }

  .preview-section:fullscreen .preview-title,
  .preview-section:-webkit-full-screen .preview-title,
  .preview-section:fullscreen #downloadConcatBtn,
  .preview-section:-webkit-full-screen #downloadConcatBtn,
  .preview-section:fullscreen #copyPreviewBtn,
  .preview-section:-webkit-full-screen #copyPreviewBtn,
  .preview-section:fullscreen #clearPreviewBtn,
  .preview-section:-webkit-full-screen #clearPreviewBtn {
    display: none;
  }

  .preview-section:fullscreen .preview-count,
  .preview-section:-webkit-full-screen .preview-count {
    font-size: 14px;
    color: #334155;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .preview-section:fullscreen .pager, .preview-section:-webkit-full-screen .pager {
    display: none !important;
  }

  .preview-section:fullscreen .page-zone, .preview-section:-webkit-full-screen .page-zone {
    display: flex; position: absolute; top: 0; bottom: 0; width: 12%; min-width: 70px;
    align-items: center; justify-content: center; cursor: pointer; z-index: 5;
    user-select: none; opacity: 0; transition: opacity .18s, background .18s;
    color: #1e293b; font-size: 32px; font-weight: 300; background: transparent;
  }
  .preview-section:fullscreen .page-zone.left, .preview-section:-webkit-full-screen .page-zone.left { left: 0; }
  .preview-section:fullscreen .page-zone.right, .preview-section:-webkit-full-screen .page-zone.right { right: 0; }
  .preview-section:fullscreen .page-zone:hover, .preview-section:-webkit-full-screen .page-zone:hover {
    opacity: 1; background: linear-gradient(to right, rgba(59,130,246,.12), transparent);
  }
  .preview-section:fullscreen .page-zone.right:hover, .preview-section:-webkit-full-screen .page-zone.right:hover {
    background: linear-gradient(to left, rgba(59,130,246,.12), transparent);
  }
  .preview-section:fullscreen .page-zone.disabled, .preview-section:-webkit-full-screen .page-zone.disabled {
    cursor: default; opacity: 0; pointer-events: none;
  }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(15, 23, 42, .45);
    display: flex; align-items: center; justify-content: center; z-index: 1000;
    padding: 20px; opacity: 0; visibility: hidden;
    transition: opacity .18s ease, visibility .18s ease;
  }
  .modal-overlay.open { opacity: 1; visibility: visible; }
  .modal {
    width: 100%; max-width: 440px; background: #fff; border-radius: 12px;
    box-shadow: 0 16px 40px rgba(0,0,0,.18); transform: translateY(-8px);
    transition: transform .18s ease; overflow: hidden;
  }
  .modal-overlay.open .modal { transform: translateY(0); }
  .modal-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px; border-bottom: 1px solid #e5e7eb;
    font-size: 16px; font-weight: 600; color: #1e293b;
  }
  .modal-close {
    border: none; background: transparent; font-size: 20px; line-height: 1;
    color: #64748b; cursor: pointer; padding: 4px 8px; border-radius: 6px;
  }
  .modal-close:hover { background: #f1f5f9; color: #1e293b; }
  .modal-body { padding: 20px; display: flex; flex-direction: column; gap: 20px; }
  .setting-group { display: flex; flex-direction: column; gap: 6px; }
  .setting-group label { font-size: 13px; font-weight: 600; color: #334155; }
  .setting-group .hint { font-size: 12px; color: #94a3b8; }
  .setting-group select { width: 100%; }

  .slider-row { display: flex; align-items: center; gap: 12px; }
  .slider-row input[type="range"] {
    flex: 1; -webkit-appearance: none; appearance: none; height: 6px;
    border-radius: 3px; background: #e2e8f0; outline: none; cursor: pointer;
  }
  .slider-row input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; width: 18px; height: 18px;
    border-radius: 50%; background: #3b82f6; border: 2px solid #fff;
    box-shadow: 0 1px 4px rgba(0,0,0,.25); cursor: pointer; transition: transform .12s;
  }
  .slider-row input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.12); }
  .slider-row input[type="range"]::-moz-range-thumb {
    width: 16px; height: 16px; border-radius: 50%; background: #3b82f6;
    border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.25); cursor: pointer;
  }
  .slider-row input[type="number"] {
    width: 68px; padding: 6px 8px; font-size: 13px; font-family: inherit;
    border: 1px solid #cbd5e1; border-radius: 6px; text-align: center;
    font-variant-numeric: tabular-nums; color: #1e293b; background: #fff;
  }
  .slider-row input[type="number"]:focus { outline: 2px solid #3b82f6; outline-offset: 1px; border-color: #3b82f6; }
  .slider-row .unit { font-size: 13px; color: #64748b; }

  .modal-footer {
    display: flex; justify-content: flex-end; gap: 10px;
    padding: 14px 20px; border-top: 1px solid #e5e7eb; background: #f8fafc;
  }

<script>
// ========== 工具函数 ==========
function naturalCompare(a, b) {
  const strA = typeof a === 'string' ? a : a.name;
  const strB = typeof b === 'string' ? b : b.name;
  let i = 0, j = 0;
  while (i < strA.length && j < strB.length) {
    if (/\d/.test(strA[i]) && /\d/.test(strB[j])) {
      let startA = i, startB = j;
      while (i < strA.length && /\d/.test(strA[i])) i++;
      while (j < strB.length && /\d/.test(strB[j])) j++;
      const numA = parseInt(strA.substring(startA, i), 10);
      const numB = parseInt(strB.substring(startB, j), 10);
      if (numA !== numB) return numA - numB;
    } else {
      const cmp = strA[i].toLowerCase().localeCompare(strB[j].toLowerCase());
      if (cmp !== 0) return cmp;
      i++; j++;
    }
  }
  return (strA.length - i) - (strB.length - j);
}

function escapeHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function formatTime(ts) {
  const diff = Date.now() - ts;
  if (diff < 60000) return '刚刚';
  if (diff < 3600000) return `${Math.floor(diff / 60000)} 分钟前`;
  if (diff < 86400000) return `${Math.floor(diff / 3600000)} 小时前`;
  if (diff < 604800000) return `${Math.floor(diff / 86400000)} 天前`;
  const d = new Date(ts);
  return `${d.getMonth() + 1}月${d.getDate()}日`;
}

// ========== 存档系统（localStorage） ==========
const STORAGE_KEY_PROGRESS = 'scn_reader_progress';
const STORAGE_KEY_BOOKMARKS = 'scn_reader_bookmarks';

function loadProgress() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY_PROGRESS);
    return raw ? JSON.parse(raw) : {};
  } catch (e) { return {}; }
}
function saveProgress(data) {
  try { localStorage.setItem(STORAGE_KEY_PROGRESS, JSON.stringify(data)); } catch (e) {}
}
function loadBookmarks() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY_BOOKMARKS);
    return raw ? JSON.parse(raw) : [];
  } catch (e) { return []; }
}
function saveBookmarks(list) {
  try { localStorage.setItem(STORAGE_KEY_BOOKMARKS, JSON.stringify(list)); } catch (e) {}
}

let saveProgressTimer = null;
function scheduleSaveProgress(fileKey, displayName, line, page) {
  if (saveProgressTimer) clearTimeout(saveProgressTimer);
  saveProgressTimer = setTimeout(() => {
    const data = loadProgress();
    data[fileKey] = { line, page, time: Date.now(), fileName: displayName };
    saveProgress(data);
  }, 400);
}

// ========== 编码检测 ==========
function detectEncoding(bytes) {
  if (!bytes || bytes.length === 0) return 'UTF-8';
  if (bytes.length >= 3 && bytes[0] === 0xEF && bytes[1] === 0xBB && bytes[2] === 0xBF) return 'UTF-8';
  if (bytes.length >= 2 && bytes[0] === 0xFF && bytes[1] === 0xFE) return 'UTF-16LE';
  if (bytes.length >= 2 && bytes[0] === 0xFE && bytes[1] === 0xFF) return 'UTF-16BE';
  const sample = bytes.slice(0, Math.min(bytes.length, 65536));
  function isValidUTF8(buf) {
    let i = 0;
    while (i < buf.length) {
      const b = buf[i];
      if (b < 0x80) { i++; continue; }
      let extra = 0;
      if ((b & 0xE0) === 0xC0) extra = 1;
      else if ((b & 0xF0) === 0xE0) extra = 2;
      else if ((b & 0xF8) === 0xF0) extra = 3;
      else return false;
      if (i + extra >= buf.length) return false;
      for (let k = 1; k <= extra; k++) {
        if ((buf[i + k] & 0xC0) !== 0x80) return false;
      }
      i += extra + 1;
    }
    return true;
  }
  function countCJK(buf, isBig5) {
    let hits = 0, total = 0, i = 0;
    while (i < buf.length) {
      const b = buf[i];
      if (b < 0x80) { i++; continue; }
      if (isBig5) {
        if (i + 1 >= buf.length) break;
        const lb = buf[i + 1];
        if ((lb >= 0x40 && lb <= 0x7E) || (lb >= 0xA1 && lb <= 0xFE)) hits++;
        total++;
        i += 2;
      } else {
        if (i + 1 >= buf.length) break;
        const lb = buf[i + 1];
        if (b >= 0x81 && b <= 0xFE && lb >= 0x40 && lb <= 0xFE && lb !== 0x7F) hits++;
        total++;
        i += 2;
      }
    }
    return total === 0 ? 0 : hits / total;
  }
  if (isValidUTF8(sample)) return 'UTF-8';
  const gbkScore = countCJK(sample, false);
  const big5Score = countCJK(sample, true);
  if (big5Score > gbkScore && big5Score > 0.85) return 'Big5';
  if (gbkScore > 0.85) return 'GBK';
  return 'GBK';
}

function decodeBytes(bytes, encoding) {
  let label = encoding;
  if (/^GBK$/i.test(label)) label = 'GBK';
  if (/^GB18030$/i.test(label)) label = 'GB18030';
  if (/^UTF-8$/i.test(label)) label = 'UTF-8';
  try {
    return new TextDecoder(label, { fatal: false }).decode(bytes);
  } catch (e) {
    try { return new TextDecoder('gb18030', { fatal: false }).decode(bytes); }
    catch (e2) { return new TextDecoder('UTF-8', { fatal: false }).decode(bytes); }
  }
}

function readFile(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const buffer = e.target.result;
      const bytes = new Uint8Array(buffer);
      const encoding = detectEncoding(bytes);
      const text = decodeBytes(bytes, encoding);
      resolve({ text, encoding });
    };
    reader.onerror = e => reject(e.target.error || new Error('读取失败'));
    reader.readAsArrayBuffer(file);
  });
}

const ALL_LANGUAGES = ['日文', '英文', '简体中文', '繁体中文'];

// ========== JSON 提取 ==========
function extractAllLanguages(root) {
  const textsArrays = [];
  if (Array.isArray(root.scenes)) {
    for (const scene of root.scenes) {
      if (Array.isArray(scene.texts)) textsArrays.push(scene.texts);
    }
  }
  if (Array.isArray(root.texts)) textsArrays.push(root.texts);
  if (textsArrays.length === 0) return { results: null, error: '未找到 texts 数组' };

  const langTexts = {};
  for (const lang of ALL_LANGUAGES) langTexts[lang] = [];

  for (const textsElement of textsArrays) {
    for (const textItem of textsElement) {
      if (!Array.isArray(textItem) || textItem.length < 2) continue;
      let dialogues = null;
      for (let i = 0; i < textItem.length; i++) {
        const elem = textItem[i];
        if (Array.isArray(elem) && elem.length > 0 && Array.isArray(elem[0])) {
          dialogues = elem; break;
        }
      }
      if (!dialogues) continue;
      let speaker = typeof textItem[0] === 'string' ? textItem[0] : '';
      const dialogueArray = dialogues;

      const langIndexMap = {};
      if (dialogueArray.length === 4) {
        langIndexMap['日文'] = 0; langIndexMap['英文'] = 1;
        langIndexMap['简体中文'] = 2; langIndexMap['繁体中文'] = 3;
      } else if (dialogueArray.length === 3) {
        langIndexMap['日文'] = 0; langIndexMap['简体中文'] = 1; langIndexMap['繁体中文'] = 2;
      } else if (dialogueArray.length === 2) {
        langIndexMap['日文'] = 0; langIndexMap['简体中文'] = 1;
      } else {
        langIndexMap['日文'] = 0;
      }

      for (const lang of ALL_LANGUAGES) {
        const idx = langIndexMap[lang];
        if (idx === undefined || idx >= dialogueArray.length) continue;
        const targetDialogue = dialogueArray[idx];
        if (!Array.isArray(targetDialogue) || targetDialogue.length < 2) continue;
        const dialogueSpeaker = typeof targetDialogue[0] === 'string' ? targetDialogue[0] : '';
        let finalSpeaker = speaker;
        if (dialogueSpeaker.trim() !== '') finalSpeaker = dialogueSpeaker;
        const text = typeof targetDialogue[1] === 'string' ? targetDialogue[1] : '';
        if (text.trim() !== '') {
          langTexts[lang].push(finalSpeaker.trim() !== '' ? `${finalSpeaker}: ${text}` : text);
        }
      }
    }
  }
  return { results: langTexts, error: null };
}

let cachedFileResults = [];

// ========== 折叠功能 ==========
function updateResultsBadge() {
  const count = cachedFileResults.length;
  resultsBadge.textContent = count === 0 ? '无文件' : `${count} 个文件`;
}

resultsHeader.addEventListener('click', () => {
  resultsCollapsed = !resultsCollapsed;
  resultsSection.classList.toggle('collapsed', resultsCollapsed);
});

// ========== 分页 ==========
const _measureCanvas = document.createElement('canvas');
const _measureCtx = _measureCanvas.getContext('2d');

function measureTextWidth(text, font) {
  _measureCtx.font = font;
  return _measureCtx.measureText(text).width;
}
function visualLinesOfLine(line, maxWidth, font) {
  if (!line) return 1;
  return Math.max(1, Math.ceil(measureTextWidth(line, font) / maxWidth));
}
function computeLogicalLinesPerPage() {
  const style = getComputedStyle(previewBody);
  const lineHeight = parseFloat(style.lineHeight) || (fontSize * 1.7);
  const paddingTop = parseFloat(style.paddingTop) || 0;
  const paddingBottom = parseFloat(style.paddingBottom) || 0;
  const innerHeight = previewBody.clientHeight - paddingTop - paddingBottom;
  let visualRows = Math.floor(innerHeight / lineHeight);
  if (!visualRows || visualRows < 1) visualRows = parseInt(previewBody.getAttribute('rows'), 10) || 20;
  const paddingLeft = parseFloat(style.paddingLeft) || 0;
  const paddingRight = parseFloat(style.paddingRight) || 0;
  const contentWidth = Math.max(1, previewBody.clientWidth - paddingLeft - paddingRight);
  const font = `${style.fontStyle} ${style.fontWeight} ${style.fontSize} ${style.fontFamily}`;
  let visualLines = 0, logicLines = 0;
  for (let i = 0; i < previewLines.length; i++) {
    const v = visualLinesOfLine(previewLines[i], contentWidth, font);
    if (visualLines + v > visualRows) break;
    visualLines += v; logicLines++;
  }
  return Math.max(1, logicLines);
}
function repaginate() {
  pageStartIndexes = [];
  if (previewLines.length === 0) { pageStartIndexes.push(0); return; }
  const linesPerPage = computeLogicalLinesPerPage();
  for (let i = 0; i < previewLines.length; i += linesPerPage) pageStartIndexes.push(i);
}

function findPageForLine(lineIndex) {
  let page = 1;
  for (let i = 0; i < pageStartIndexes.length; i++) {
    if (pageStartIndexes[i] <= lineIndex) page = i + 1; else break;
  }
  return page;
}

function renderPage() {
  if (previewLines.length === 0) {
    previewBody.value = ''; previewBody.disabled = true;
    previewHighlightLayer.innerHTML = '';
    pageIndicator.textContent = '0 / 0';
    jumpTotal.textContent = '/ 0';
    previewCount.textContent = '';
    prevPageBtn.disabled = true; nextPageBtn.disabled = true;
    bookmarkBtn.disabled = true;
    pageZoneLeft.classList.add('disabled'); pageZoneRight.classList.add('disabled');
    return;
  }
  previewBody.disabled = false;
  bookmarkBtn.disabled = false;
  const totalPages = pageStartIndexes.length;
  if (currentPage > totalPages) currentPage = totalPages;
  if (currentPage < 1) currentPage = 1;
  const start = pageStartIndexes[currentPage - 1];
  const nextStart = currentPage < totalPages ? pageStartIndexes[currentPage] : previewLines.length;
  previewBody.value = previewLines.slice(start, nextStart).join('\n');
  previewBody.scrollTop = 0;

  pageIndicator.textContent = `${currentPage} / ${totalPages}`;
  jumpTotal.textContent = `/ ${totalPages}`;
  jumpInput.max = totalPages;

  if (isFullscreen()) {
    previewCount.textContent = `${currentPage} / ${totalPages}`;
  } else {
    previewCount.textContent = `共 ${previewLines.length} 行 · ${currentPreviewText.length} 字符（第 ${start + 1}-${nextStart} 行）`;
  }

  prevPageBtn.disabled = currentPage <= 1;
  nextPageBtn.disabled = currentPage >= totalPages;
  pageZoneLeft.classList.toggle('disabled', currentPage <= 1);
  pageZoneRight.classList.toggle('disabled', currentPage >= totalPages);

  if (currentFileKey) {
    scheduleSaveProgress(currentFileKey, currentDisplayFileName, start, currentPage);
  }

  updateBookmarkBtnState();
  updateHighlightLayer(start, nextStart);
}

function updateHighlightLayer(startLine, endLine) {
  if (!searchTerm || searchResults.length === 0) {
    previewHighlightLayer.innerHTML = '';
    return;
  }
  let html = '';
  for (let lineIdx = startLine; lineIdx < endLine; lineIdx++) {
    const lineText = previewLines[lineIdx] || '';
    let lineHtml = '';
    let lastIndex = 0;
    const matchesInLine = searchResults.filter(r => r.lineIndex === lineIdx);
    if (matchesInLine.length === 0) {
      lineHtml = escapeHtml(lineText);
    } else {
      for (const m of matchesInLine) {
        if (m.charIndex > lastIndex) {
          lineHtml += escapeHtml(lineText.slice(lastIndex, m.charIndex));
        }
        const isCurrent = (searchResults[currentSearchIndex] &&
                          searchResults[currentSearchIndex].lineIndex === m.lineIndex &&
                          searchResults[currentSearchIndex].charIndex === m.charIndex);
        lineHtml += `<span class="search-highlight${isCurrent ? ' current' : ''}">${escapeHtml(lineText.slice(m.charIndex, m.charIndex + m.length))}</span>`;
        lastIndex = m.charIndex + m.length;
      }
      if (lastIndex < lineText.length) {
        lineHtml += escapeHtml(lineText.slice(lastIndex));
      }
    }
    html += lineHtml + '\n';
  }
  previewHighlightLayer.innerHTML = html.replace(/\n$/, '');
}

// ★ 新增 sources 参数
function setPreviewContent(title, textContent, fileKey, sourceLabel, sources) {
  currentPreviewText = textContent || '';
  currentFileKey = fileKey || title;
  currentDisplayFileName = (fileKey === '__CONCAT__') ? '拼接预览' : (fileKey || title);
  currentSources = Array.isArray(sources) ? sources.slice() : [];
  previewTitle.textContent = title;
  previewLines = currentPreviewText === '' ? [] : currentPreviewText.split('\n');
  currentPage = 1;
  repaginate();
  const hasContent = previewLines.length > 0;
  pager.style.display = hasContent ? 'flex' : 'none';
  copyPreviewBtn.disabled = !hasContent;
  clearPreviewBtn.disabled = !hasContent;
  fullscreenBtn.disabled = !hasContent;
  bookmarkBtn.disabled = !hasContent;
  resetForceShowAll();
  clearSearch(true);
  renderPage();

  if (hasContent && currentFileKey) {
    checkResumePrompt();
  } else {
    hideResumeBar();
  }

  renderBookmarksList();
}

function clearPreview() {
  currentPreviewText = ''; previewLines = []; pageStartIndexes = []; currentPage = 1;
  currentFileKey = '';
  currentDisplayFileName = '';
  currentSources = [];
  previewTitle.textContent = '预览区'; previewCount.textContent = '';
  previewBody.value = ''; previewBody.disabled = true;
  previewHighlightLayer.innerHTML = '';
  pager.style.display = 'none';
  copyPreviewBtn.disabled = true; clearPreviewBtn.disabled = true;
  downloadConcatBtn.disabled = true; fullscreenBtn.disabled = true;
  bookmarkBtn.disabled = true;
  pageZoneLeft.classList.add('disabled'); pageZoneRight.classList.add('disabled');
  resetForceShowAll();
  clearSearch(true);
  hideResumeBar();
  renderBookmarksList();
}

function resetForceShowAll() {
  forceShowAllBookmarks = false;
  if (forceShowAllToggle) forceShowAllToggle.checked = false;
}

// ========== 续读功能 ==========
let pendingResumeLine = null;

function checkResumePrompt() {
  if (!currentFileKey) { hideResumeBar(); return; }
  const progress = loadProgress();
  const saved = progress[currentFileKey];
  if (!saved || typeof saved.line !== 'number' || saved.line <= 0) {
    hideResumeBar();
    return;
  }
  if (saved.fileName && currentDisplayFileName && saved.fileName !== currentDisplayFileName) {
    hideResumeBar();
    return;
  }
  if (saved.line >= previewLines.length) { hideResumeBar(); return; }
  pendingResumeLine = saved.line;
  const page = findPageForLine(saved.line);
  const timeStr = formatTime(saved.time);
  resumeText.innerHTML = `上次读到第 <strong>${page}</strong> 页（共 ${pageStartIndexes.length} 页）· ${timeStr}`;
  resumeBar.classList.add('show');
}

function hideResumeBar() {
  resumeBar.classList.remove('show');
  pendingResumeLine = null;
}

resumeBtn.addEventListener('click', () => {
  if (pendingResumeLine === null) return;
  const page = findPageForLine(pendingResumeLine);
  currentPage = page;
  renderPage();
  hideResumeBar();
});

resumeDismissBtn.addEventListener('click', () => {
  hideResumeBar();
});

// ========== 书签功能 ==========
function getCurrentLine() {
  if (previewLines.length === 0) return 0;
  return pageStartIndexes[currentPage - 1] || 0;
}

function isCurrentPageBookmarked() {
  if (!currentFileKey) return false;
  const line = getCurrentLine();
  const bookmarks = loadBookmarks();
  return bookmarks.some(b => b.file === currentFileKey && b.line === line);
}

function updateBookmarkBtnState() {
  if (!currentFileKey || previewLines.length === 0) {
    bookmarkBtn.classList.remove('active');
    bookmarkBtn.disabled = true;
    return;
  }
  bookmarkBtn.disabled = false;
  if (isCurrentPageBookmarked()) {
    bookmarkBtn.classList.add('active');
    bookmarkBtn.title = '当前页已有书签，点击删除';
  } else {
    bookmarkBtn.classList.remove('active');
    bookmarkBtn.title = '在当前页添加书签';
  }
}

bookmarkBtn.addEventListener('click', () => {
  if (!currentFileKey || previewLines.length === 0) return;
  const line = getCurrentLine();
  let bookmarks = loadBookmarks();
  const existingIdx = bookmarks.findIndex(b => b.file === currentFileKey && b.line === line);
  if (existingIdx >= 0) {
    bookmarks.splice(existingIdx, 1);
    saveBookmarks(bookmarks);
  } else {
    const previewText = (previewLines[line] || '').slice(0, 40);
    bookmarks.push({
      file: currentFileKey,
      fileName: currentDisplayFileName || currentFileKey,
      sources: currentSources.slice(),   // ★ 准确来源
      line: line,
      preview: previewText,
      time: Date.now()
    });
    const sameFile = bookmarks.filter(b => b.file === currentFileKey);
    if (sameFile.length > 50) {
      const oldest = sameFile.reduce((a, b) => a.time < b.time ? a : b);
      bookmarks = bookmarks.filter(b => b !== oldest);
    }
    saveBookmarks(bookmarks);
  }
  updateBookmarkBtnState();
  renderBookmarksList();
});

function isBookmarkOfCurrentFile(bm) {
  if (!currentFileKey) return false;
  if (bm.file === currentFileKey) return true;
  const bmName = bm.fileName || (bm.file === '__CONCAT__' ? '拼接预览' : bm.file);
  return !!(bmName && currentDisplayFileName && bmName === currentDisplayFileName);
}

// 书签列表渲染
function renderBookmarksList() {
  const bookmarks = loadBookmarks();

  const currentBookmarks = bookmarks.filter(isBookmarkOfCurrentFile);
  const otherBookmarks = bookmarks.filter(b => !isBookmarkOfCurrentFile(b));

  let visibleBookmarks;
  if (forceShowAllBookmarks) {
    visibleBookmarks = [
      ...currentBookmarks.sort((a, b) => a.line - b.line),
      ...otherBookmarks.sort((a, b) => {
        const fa = a.fileName || a.file, fb = b.fileName || b.file;
        if (fa !== fb) return String(fa).localeCompare(String(fb));
        return a.line - b.line;
      })
    ];
  } else {
    visibleBookmarks = currentBookmarks.sort((a, b) => a.line - b.line);
  }

  bookmarksCount.textContent = forceShowAllBookmarks
    ? `${visibleBookmarks.length} 个（全部）`
    : `${visibleBookmarks.length} 个`;
  bmBadge.textContent = visibleBookmarks.length;

  if (bookmarks.length > 0) {
    bookmarkListBtn.style.display = 'inline-block';
  } else {
    bookmarkListBtn.style.display = 'none';
    bookmarksPanel.classList.remove('show');
  }

  if (visibleBookmarks.length === 0) {
    let emptyMsg = '当前文件还没有书签，阅读时点击 🔖 按钮添加';
    if (!forceShowAllBookmarks && otherBookmarks.length > 0) {
      emptyMsg += `<br><br>检测到其他文件有 <strong>${otherBookmarks.length}</strong> 个书签。`
        + `<br><button class="inline-force-btn" id="forceShowAllInlineBtn">🔓 强制显示全部书签</button>`;
    }
    bookmarksList.innerHTML = `<div class="bookmarks-empty">${emptyMsg}</div>`;
    const inlineBtn = document.getElementById('forceShowAllInlineBtn');
    if (inlineBtn) {
      inlineBtn.addEventListener('click', () => {
        forceShowAllBookmarks = true;
        if (forceShowAllToggle) forceShowAllToggle.checked = true;
        renderBookmarksList();
      });
    }
    return;
  }

  let html = '';
  for (const bm of visibleBookmarks) {
    const isCurrentFile = isBookmarkOfCurrentFile(bm);
    const page = isCurrentFile ? findPageForLine(bm.line) : null;
    const displayFileName = bm.fileName || (bm.file === '__CONCAT__' ? '拼接预览' : bm.file);

    // ★ 来源展示
    let sourceHtml = '';
    const sources = Array.isArray(bm.sources) ? bm.sources : null;
    if (sources && sources.length > 0) {
      if (sources.length === 1) {
        sourceHtml = `<div class="bm-source">来源：${escapeHtml(sources[0])}</div>`;
      } else {
        const previewNames = sources.slice(0, 2).map(escapeHtml).join('、');
        const moreCount = sources.length - 2;
        sourceHtml = `
          <div class="bm-source">
            来源：${previewNames}${moreCount > 0 ? ` 等 ${sources.length} 个文件` : ''}
            <button type="button" class="bm-source-toggle">展开</button>
            <div class="bm-source-full" hidden>
              ${sources.map(s => `<div>· ${escapeHtml(s)}</div>`).join('')}
            </div>
          </div>
        `;
      }
    } else if (bm.file && bm.file !== '__CONCAT__') {
      sourceHtml = `<div class="bm-source">来源：${escapeHtml(bm.file)}</div>`;
    }

    html += `
      <div class="bookmark-item${isCurrentFile ? '' : ' other-file'}">
        <span class="bm-icon">${isCurrentFile ? '🔖' : '📄'}</span>
        <div class="bm-content">
          <div class="bm-file" title="${escapeHtml(displayFileName)}">
            <span>📄</span><span>${escapeHtml(displayFileName)}</span>
          </div>
          ${sourceHtml}
          <div class="bm-line">${page ? `第 ${page} 页 · ` : ''}第 ${bm.line + 1} 行</div>
          <div class="bm-preview">${escapeHtml(bm.preview || '（空行）')}</div>
          <div class="bm-time">${formatTime(bm.time)}</div>
        </div>
        <div class="bm-actions">
          <button data-action="goto"
                  data-line="${bm.line}"
                  data-file="${escapeHtml(bm.file)}"
                  ${isCurrentFile ? '' : 'disabled title="仅当前文件可跳转"'}>跳转</button>
          <button data-action="delete"
                  data-line="${bm.line}"
                  data-file="${escapeHtml(bm.file)}"
                  class="bm-delete">删除</button>
        </div>
      </div>
    `;
  }
  bookmarksList.innerHTML = html;
}

bookmarksList.addEventListener('click', (e) => {
  // 展开/折叠来源
  const toggle = e.target.closest('.bm-source-toggle');
  if (toggle) {
    const full = toggle.parentElement.querySelector('.bm-source-full');
    if (full) {
      if (full.hasAttribute('hidden')) {
        full.removeAttribute('hidden');
        toggle.textContent = '收起';
      } else {
        full.setAttribute('hidden', '');
        toggle.textContent = '展开';
      }
    }
    return;
  }
  const btn = e.target.closest('button');
  if (!btn || btn.disabled) return;
  const action = btn.dataset.action;
  const line = parseInt(btn.dataset.line, 10);
  const file = btn.dataset.file;
  if (isNaN(line) || !file) return;

  if (action === 'goto') {
    if (file !== currentFileKey) return;
    const page = findPageForLine(line);
    currentPage = page;
    renderPage();
    bookmarksPanel.classList.remove('show');
  } else if (action === 'delete') {
    let bookmarks = loadBookmarks();
    bookmarks = bookmarks.filter(b => !(b.file === file && b.line === line));
    saveBookmarks(bookmarks);
    updateBookmarkBtnState();
    renderBookmarksList();
  }
});

bookmarkListBtn.addEventListener('click', () => {
  bookmarksPanel.classList.toggle('show');
});
bookmarksCloseBtn.addEventListener('click', () => {
  bookmarksPanel.classList.remove('show');
});

forceShowAllToggle.addEventListener('change', (e) => {
  forceShowAllBookmarks = e.target.checked;
  renderBookmarksList();
});

// ========== 翻页 ==========
function goPrev() { if (currentPage > 1) { currentPage--; renderPage(); } }
function goNext() { if (currentPage < pageStartIndexes.length) { currentPage++; renderPage(); } }
prevPageBtn.addEventListener('click', goPrev);
nextPageBtn.addEventListener('click', goNext);
pageZoneLeft.addEventListener('click', goPrev);
pageZoneRight.addEventListener('click', goNext);

function jumpToPage(page) {
  const totalPages = pageStartIndexes.length;
  if (totalPages === 0) return;
  let target = parseInt(page, 10);
  if (isNaN(target)) return;
  target = Math.min(totalPages, Math.max(1, target));
  if (target === currentPage) {
    jumpInput.value = '';
    return;
  }
  currentPage = target;
  renderPage();
  jumpInput.value = '';
}
jumpBtn.addEventListener('click', () => jumpToPage(jumpInput.value));
jumpInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    jumpToPage(jumpInput.value);
  }
});

// ========== 搜索功能 ==========
function clearSearch(silent) {
  searchTerm = '';
  searchResults = [];
  currentSearchIndex = -1;
  searchInput.value = '';
  searchInfo.textContent = '';
  searchPrevBtn.style.display = 'none';
  searchNextBtn.style.display = 'none';
  searchClearBtn.style.display = 'none';
  previewHighlightLayer.innerHTML = '';
  if (!silent) renderPage();
}

function performSearch(term) {
  if (!term || term.trim() === '') {
    clearSearch();
    return;
  }
  searchTerm = term;
  searchResults = [];
  currentSearchIndex = -1;

  const lowerTerm = term.toLowerCase();
  for (let lineIdx = 0; lineIdx < previewLines.length; lineIdx++) {
    const line = previewLines[lineIdx] || '';
    const lowerLine = line.toLowerCase();
    let fromIndex = 0;
    while (true) {
      const idx = lowerLine.indexOf(lowerTerm, fromIndex);
      if (idx === -1) break;
      searchResults.push({ lineIndex: lineIdx, charIndex: idx, length: term.length });
      fromIndex = idx + Math.max(1, term.length);
    }
  }

  if (searchResults.length === 0) {
    searchInfo.textContent = '未找到';
    searchInfo.style.color = '#dc2626';
    searchPrevBtn.style.display = 'none';
    searchNextBtn.style.display = 'none';
    searchClearBtn.style.display = 'inline-block';
    previewHighlightLayer.innerHTML = '';
    renderPage();
    return;
  }

  searchInfo.style.color = '#64748b';
  currentSearchIndex = 0;
  searchPrevBtn.style.display = 'inline-block';
  searchNextBtn.style.display = 'inline-block';
  searchClearBtn.style.display = 'inline-block';
  gotoSearchResult(0);
}

function gotoSearchResult(idx) {
  if (idx < 0 || idx >= searchResults.length) return;
  currentSearchIndex = idx;
  const result = searchResults[idx];
  const page = findPageForLine(result.lineIndex);
  if (page !== currentPage) {
    currentPage = page;
    renderPage();
  } else {
    const start = pageStartIndexes[currentPage - 1];
    const nextStart = currentPage < pageStartIndexes.length ? pageStartIndexes[currentPage] : previewLines.length;
    updateHighlightLayer(start, nextStart);
  }
  searchInfo.textContent = `${idx + 1} / ${searchResults.length}`;
}

searchBtn.addEventListener('click', () => performSearch(searchInput.value));
searchInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    performSearch(searchInput.value);
  }
});
searchInput.addEventListener('input', () => {
  if (searchInput.value === '' && searchTerm !== '') {
    clearSearch();
  }
});
searchPrevBtn.addEventListener('click', () => {
  if (searchResults.length === 0) return;
  const next = (currentSearchIndex - 1 + searchResults.length) % searchResults.length;
  gotoSearchResult(next);
});
searchNextBtn.addEventListener('click', () => {
  if (searchResults.length === 0) return;
  const next = (currentSearchIndex + 1) % searchResults.length;
  gotoSearchResult(next);
});
searchClearBtn.addEventListener('click', () => clearSearch());

// ========== 全屏 + 滚轮翻页 ==========
function isFullscreen() {
  return document.fullscreenElement === previewSection ||
         document.webkitFullscreenElement === previewSection;
}

function handleFullscreenWheel(e) {
  if (!isFullscreen()) return;
  if (previewLines.length === 0) return;
  if (Math.abs(e.deltaY) < 1) return;
  e.preventDefault();
  e.stopPropagation();
  if (e.deltaY > 0) {
    if (currentPage < pageStartIndexes.length) goNext();
  } else if (e.deltaY < 0) {
    if (currentPage > 1) goPrev();
  }
}

previewSection.addEventListener('wheel', handleFullscreenWheel, { passive: false });

fullscreenBtn.addEventListener('click', () => {
  if (isFullscreen()) {
    if (document.exitFullscreen) document.exitFullscreen();
    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
  } else {
    if (previewSection.requestFullscreen) previewSection.requestFullscreen();
    else if (previewSection.webkitRequestFullscreen) previewSection.webkitRequestFullscreen();
  }
});
function onFullscreenChange() {
  const fs = isFullscreen();
  fullscreenBtn.textContent = fs ? '退出全屏' : '全屏';
  if (previewLines.length > 0) renderPage();
  setTimeout(() => {
    if (previewLines.length > 0) {
      const currentStart = pageStartIndexes[currentPage - 1] || 0;
      repaginate();
      let targetPage = 1;
      for (let i = 0; i < pageStartIndexes.length; i++) {
        if (pageStartIndexes[i] <= currentStart) targetPage = i + 1; else break;
      }
      currentPage = targetPage; renderPage();
    }
  }, 80);
}
document.addEventListener('fullscreenchange', onFullscreenChange);
document.addEventListener('webkitfullscreenchange', onFullscreenChange);

// ========== 字体大小 ==========
function applyFontSize(size) {
  const clamped = Math.min(24, Math.max(10, size));
  fontSize = clamped;
  previewBody.style.fontSize = clamped + 'px';
  previewHighlightLayer.style.fontSize = clamped + 'px';
  fontSizeSlider.value = String(clamped);
  fontSizeNumber.value = String(clamped);
  if (previewLines.length > 0) {
    const currentStart = pageStartIndexes[currentPage - 1] || 0;
    repaginate();
    let targetPage = 1;
    for (let i = 0; i < pageStartIndexes.length; i++) {
      if (pageStartIndexes[i] <= currentStart) targetPage = i + 1; else break;
    }
    currentPage = targetPage; renderPage();
  }
}

// ========== 设置弹窗 ==========
function openSettings() {
  pageSizeSelect.value = String(previewBody.getAttribute('rows') || 20);
  fontSizeSlider.value = String(fontSize);
  fontSizeNumber.value = String(fontSize);
  settingsOverlay.classList.add('open');
}
function closeSettings() { settingsOverlay.classList.remove('open'); }
openSettingsBtn.addEventListener('click', openSettings);
closeSettingsBtn.addEventListener('click', closeSettings);
closeSettingsFooterBtn.addEventListener('click', closeSettings);
settingsOverlay.addEventListener('click', (e) => { if (e.target === settingsOverlay) closeSettings(); });
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && settingsOverlay.classList.contains('open')) closeSettings();
});
pageSizeSelect.addEventListener('change', () => {
  const rows = parseInt(pageSizeSelect.value, 10);
  previewBody.setAttribute('rows', rows);
  pageSize = rows;
  if (previewLines.length > 0) {
    const currentStart = pageStartIndexes[currentPage - 1] || 0;
    repaginate();
    let targetPage = 1;
    for (let i = 0; i < pageStartIndexes.length; i++) {
      if (pageStartIndexes[i] <= currentStart) targetPage = i + 1; else break;
    }
    currentPage = targetPage; renderPage();
  }
});
fontSizeSlider.addEventListener('input', () => {
  const size = parseFloat(fontSizeSlider.value);
  if (!isNaN(size)) applyFontSize(size);
});
fontSizeNumber.addEventListener('input', () => {
  const size = parseFloat(fontSizeNumber.value);
  if (!isNaN(size)) applyFontSize(size);
});
fontSizeNumber.addEventListener('blur', () => {
  let size = parseFloat(fontSizeNumber.value);
  if (isNaN(size)) size = 13.5;
  applyFontSize(size);
});
fontSizeNumber.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); fontSizeNumber.blur(); }
});

// ========== 下载 / 复制 / 清空 ==========
downloadConcatBtn.addEventListener('click', () => {
  if (!currentPreviewText) return;
  const blob = new Blob([currentPreviewText], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `拼接剧本_${languageSelect.value}.txt`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  const old = downloadConcatBtn.textContent;
  downloadConcatBtn.textContent = '已下载 ✓';
  setTimeout(() => { downloadConcatBtn.textContent = old; }, 1200);
});
copyPreviewBtn.addEventListener('click', async () => {
  if (!currentPreviewText) return;
  try {
    await navigator.clipboard.writeText(currentPreviewText);
  } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = currentPreviewText;
    document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
  }
  const old = copyPreviewBtn.textContent;
  copyPreviewBtn.textContent = '已复制 ✓';
  setTimeout(() => { copyPreviewBtn.textContent = old; }, 1200);
});
clearPreviewBtn.addEventListener('click', () => {
  if (isFullscreen()) {
    if (document.exitFullscreen) document.exitFullscreen();
    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
  }
  clearPreview();
});

// ========== 删除单个文件 ==========
function removeFile(fileName) {
  cachedFileResults = cachedFileResults.filter(c => c.fileName !== fileName);
  extractionResults = extractionResults.filter(r => r.fileName !== fileName);
  updateResultsBadge();

  // 删除相关书签 + 更新拼接书签的 sources
  let bookmarks = loadBookmarks();
  bookmarks = bookmarks.filter(b => {
    if (b.file === fileName) return false;
    if (b.fileName === fileName && b.file !== '__CONCAT__') return false;

    if (Array.isArray(b.sources) && b.sources.includes(fileName)) {
      b.sources = b.sources.filter(s => s !== fileName);
      if (b.sources.length === 0 && b.file === '__CONCAT__') return false;
      if (b.file === '__CONCAT__') {
        // 更新展示名
        b.fileName = b.sources.length === 1
          ? `拼接预览（${b.sources[0]}）`
          : `拼接预览（${b.sources[0]} 等 ${b.sources.length} 个文件）`;
      }
    }
    return true;
  });
  saveBookmarks(bookmarks);

  if (cachedFileResults.length === 0) {
    clearPreview();
    statusDiv.textContent = '已删除全部文件。请重新选择 JSON 文件或 TXT。';
    resultsDiv.innerHTML = '';
    return;
  }
  renderResults();

  const okCount = extractionResults.filter(r => !r.error && r.texts.length > 0).length;
  if (okCount > 0) showConcatPreview();
  else clearPreview();
  statusDiv.textContent = `已删除「${fileName}」。当前剩余 ${cachedFileResults.length} 个文件。`;
}

// ========== 结果渲染 ==========
function renderResults() {
  resultsDiv.innerHTML = '';
  const lang = languageSelect.value;
  for (const cached of cachedFileResults) {
    if (cached.error) {
      addResult(cached.fileName, cached.error, null, true);
    } else {
      const texts = cached.languages[lang] || [];
      addResult(cached.fileName, `已提取 ${texts.length} 条文本（${lang}）`, texts.join('\n'), false);
    }
  }
  updateResultsBadge();
}
function addResult(fileName, message, txtContent, failed) {
  const div = document.createElement('div');
  div.className = 'result-item';
  const quickDel = document.createElement('button');
  quickDel.className = 'card-delete';
  quickDel.title = '删除此文件';
  quickDel.textContent = '✕';
  quickDel.onclick = (e) => {
    e.stopPropagation();
    if (failed) {
      removeFile(fileName);
    } else {
      if (confirm(`确定要删除「${fileName}」吗？\n删除后将无法恢复，并会同步更新预览和书签。`)) {
        removeFile(fileName);
      }
    }
  };
  div.appendChild(quickDel);

  const h3 = document.createElement('h3');
  h3.textContent = fileName;
  if (failed) h3.classList.add('failed');
  const p = document.createElement('p');
  p.textContent = message;
  if (failed) p.classList.add('error');
  div.appendChild(h3); div.appendChild(p);
  if (txtContent !== null) {
    const actions = document.createElement('div');
    actions.className = 'actions';

    const concatPreviewBtn = document.createElement('button');
    concatPreviewBtn.className = 'preview-btn';
    concatPreviewBtn.textContent = '拼接预览';
    concatPreviewBtn.onclick = () => {
      showConcatPreview();
      previewSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
    };
    actions.appendChild(concatPreviewBtn);

    const singlePreviewBtn = document.createElement('button');
    singlePreviewBtn.textContent = '单独预览';
    singlePreviewBtn.onclick = () => {
      // ★ 传 sources
      setPreviewContent(fileName, txtContent, fileName, fileName, [fileName]);
      downloadConcatBtn.disabled = true;
      previewSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
    };
    actions.appendChild(singlePreviewBtn);

    const downloadBtn = document.createElement('button');
    downloadBtn.textContent = '下载提取的文本';
    downloadBtn.onclick = () => {
      const blob = new Blob([txtContent], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = fileName.replace(/\.json$/i, `_${languageSelect.value}_texts.txt`);
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
    };
    actions.appendChild(downloadBtn);

    const delBtn = document.createElement('button');
    delBtn.className = 'delete-btn';
    delBtn.textContent = '删除';
    delBtn.onclick = () => {
      if (failed) {
        removeFile(fileName);
      } else {
        if (confirm(`确定要删除「${fileName}」吗？\n删除后将无法恢复，并会同步更新预览和书签。`)) {
          removeFile(fileName);
        }
      }
    };
    actions.appendChild(delBtn);

    div.appendChild(actions);
  } else {
    const actions = document.createElement('div');
    actions.className = 'actions';
    const delBtn = document.createElement('button');
    delBtn.className = 'delete-btn';
    delBtn.textContent = '删除';
    delBtn.onclick = () => {
      removeFile(fileName);
    };
    actions.appendChild(delBtn);
    div.appendChild(actions);
  }
  resultsDiv.appendChild(div);
}

// ========== 拼接预览 ==========
function buildConcatText() {
  if (!extractionResults || extractionResults.length === 0) return null;
  const sorted = [...extractionResults].sort((a, b) => naturalCompare(a.fileName, b.fileName));
  const ok = sorted.filter(r => !r.error && Array.isArray(r.texts) && r.texts.length > 0);
  if (ok.length === 0) return null;
  const parts = [];
  for (const res of ok) {
    const block = res.texts.join('\n');
    if (block.trim() !== '') {
      if (parts.length > 0) parts.push('');
      parts.push(block);
    }
  }
  if (parts.length === 0) return null;
  return { text: parts.join('\n'), count: ok.length };
}

function showConcatPreview() {
  if (!extractionResults || extractionResults.length === 0) {
    setPreviewContent('拼接预览', '请先选择 JSON 文件处理后再预览。', '');
    downloadConcatBtn.disabled = true;
    return;
  }
  const result = buildConcatText();
  if (!result) {
    setPreviewContent('拼接预览', '当前语言下没有成功提取的文本，无法拼接。', '');
    downloadConcatBtn.disabled = true;
    return;
  }

  // ★ 拼接的准确来源文件列表
  const okFiles = [...extractionResults]
    .filter(r => !r.error && Array.isArray(r.texts) && r.texts.length > 0)
    .sort((a, b) => naturalCompare(a.fileName, b.fileName))
    .map(r => r.fileName);

  const label = okFiles.length <= 1
    ? (okFiles[0] || '')
    : `${okFiles[0]} 等 ${okFiles.length} 个文件`;

  setPreviewContent(
    `拼接预览（${result.count} 个成功文件）`,
    result.text,
    '__CONCAT__',
    label,
    okFiles
  );
  downloadConcatBtn.disabled = false;
}

// ========== 处理 JSON ==========
async function processJsonFiles(files) {
  const jsonFiles = files.filter(f => f.name.toLowerCase().endsWith('.json'));
  if (jsonFiles.length === 0) { statusDiv.textContent = '未找到 .json 文件'; return; }

  jsonFiles.sort(naturalCompare);
  resultsDiv.innerHTML = '';
  clearPreview();
  cachedFileResults = [];
  extractionResults = [];
  updateResultsBadge();
  statusDiv.textContent = `共找到 ${jsonFiles.length} 个 JSON 文件，正在解析...`;

  let okCount = 0, failCount = 0;
  const failedFiles = [];

  for (const file of jsonFiles) {
    try {
      const { text } = await readFile(file);
      const root = JSON.parse(text);
      const { results, error } = extractAllLanguages(root);
      if (error) {
        cachedFileResults.push({ fileName: file.name, languages: null, error });
        failCount++; failedFiles.push({ fileName: file.name, error });
      } else {
        cachedFileResults.push({ fileName: file.name, languages: results, error: null });
        okCount++;
      }
    } catch (e) {
      const errMsg = `解析错误: ${e.message}`;
      cachedFileResults.push({ fileName: file.name, languages: null, error: errMsg });
      failCount++; failedFiles.push({ fileName: file.name, error: errMsg });
    }
  }

  statusDiv.textContent = `处理完成：成功 ${okCount} 个，失败 ${failCount} 个。`;
  if (failedFiles.length > 0) {
    alert('以下文件处理失败：\n\n' + failedFiles.map(f => `· ${f.fileName}\n  ${f.error}`).join('\n\n'));
  }

  const lang = languageSelect.value;
  extractionResults = cachedFileResults.map(c => c.error
    ? { fileName: c.fileName, texts: [], error: c.error }
    : { fileName: c.fileName, texts: c.languages[lang] || [], error: null });
  renderResults();
  if (okCount > 0) showConcatPreview();
}
function handleJsonFiles(files) {
  lastFiles = Array.from(files).filter(f => f.name.toLowerCase().endsWith('.json'));
  if (lastFiles.length === 0) {
    statusDiv.textContent = '未找到 .json 文件';
    resultsDiv.innerHTML = '';
    clearPreview();
    cachedFileResults = []; extractionResults = [];
    updateResultsBadge();
    return;
  }
  processJsonFiles(lastFiles);
}

// ========== 处理 TXT ==========
async function handleTxtFiles(files) {
  const txtFiles = Array.from(files).filter(f => f.name.toLowerCase().endsWith('.txt'));
  if (txtFiles.length === 0) {
    statusDiv.textContent = '未找到 .txt 文件';
    return;
  }
  txtFiles.sort(naturalCompare);
  const file = txtFiles[0];
  try {
    statusDiv.textContent = `正在读取 ${file.name} ...`;
    const { text, encoding } = await readFile(file);
    // ★ 传 sources
    setPreviewContent(`📄 ${file.name}（TXT直读 · ${encoding}）`, text, file.name, file.name, [file.name]);
    downloadConcatBtn.disabled = true;
    statusDiv.textContent = `已直接加载：${file.name}（编码 ${encoding}，${text.length} 字符）`
      + (txtFiles.length > 1 ? ` · 共选中 ${txtFiles.length} 个，仅预览第一个` : '');
    previewSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
  } catch (e) {
    statusDiv.textContent = `读取 TXT 失败：${e.message}`;
  }
}

// ========== 事件绑定 ==========
pickFilesBtn.addEventListener('click', () => fileInput.click());
pickFolderBtn.addEventListener('click', () => folderInput.click());
pickTxtBtn.addEventListener('click', () => txtInput.click());

fileInput.addEventListener('change', e => {
  if (e.target.files.length) handleJsonFiles(e.target.files);
  fileInput.value = '';
});
folderInput.addEventListener('change', e => {
  if (e.target.files.length) handleJsonFiles(e.target.files);
  folderInput.value = '';
});
txtInput.addEventListener('change', e => {
  if (e.target.files.length) handleTxtFiles(e.target.files);
  txtInput.value = '';
});

languageSelect.addEventListener('change', () => {
  if (cachedFileResults.length === 0) return;
  const lang = languageSelect.value;
  extractionResults = cachedFileResults.map(c => c.error
    ? { fileName: c.fileName, texts: [], error: c.error }
    : { fileName: c.fileName, texts: c.languages[lang] || [], error: null });
  renderResults();
  const okCount = extractionResults.filter(r => !r.error && r.texts.length > 0).length;
  if (okCount > 0) showConcatPreview();
  else clearPreview();
});

// ========== 初始化 ==========
function init() {
  statusDiv.textContent = '请选择 JSON 文件或文件夹，或使用「选择 TXT 直接预览」快速阅读。支持自动续读、书签、跳页、搜索。书签和进度保存在浏览器缓存中，清理缓存会丢失，请留意。';
  updateResultsBadge();
  clearPreview();
  renderBookmarksList();
}
init();

window.addEventListener('beforeunload', () => {
  if (currentFileKey && previewLines.length > 0) {
    const data = loadProgress();
    data[currentFileKey] = {
      line: pageStartIndexes[currentPage - 1] || 0,
      page: currentPage,
      time: Date.now(),
      fileName: currentDisplayFileName
    };
    saveProgress(data);
  }
});

window.addEventListener('storage', (e) => {
  if (e.key === STORAGE_KEY_BOOKMARKS) {
    renderBookmarksList();
    updateBookmarkBtnState();
  }
});
</script>
